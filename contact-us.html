<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us | PLANTeeShirts</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
    crossorigin="anonymous">
</head>

<body class="d-flex flex-column min-vh-100">

  <div class="bg-1 py-3 border-bottom">
    <div class="container">
      <a class="navbar-brand fs-4 font-weight-bold" href="home.html">PLANTeeShirts</a>
    </div>
  </div>

  <nav class="navbar md:navbar-expand bg-1 border-bottom">
    <div class="container">
      <button class="btn-icon navbar-toggler" type="button"
        data-bs-toggle="drawer" data-bs-target="#mainNav"
        aria-controls="mainNav" aria-expanded="false" aria-label="Toggle
        navigation">
        <span class="navbar-toggler-icon" aria-hidden="true"></span>
      </button>

      <dialog class="drawer drawer-end" tabindex="-1" id="mainNav"
        aria-labelledby="mainNavLabel">
        <div class="drawer-header">
          <h5 class="drawer-title" id="mainNavLabel">Menu</h5>
          <button type="button" class="btn-close" data-bs-dismiss="drawer"
            aria-label="Close"></button>
        </div>

        <div class="drawer-body">
          <ul class="nav navbar-nav">
            <li class="nav-item"><a class="nav-link" href="home.html">HOME</a></li>
            <li class="nav-item"><a class="nav-link" href="shop.html">SHOP</a></li>
            <li class="nav-item"><a class="nav-link" href="about-us.html">ABOUT US</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="contact-us.html">CONTACT US</a></li>
          </ul>
        </div>
      </dialog>
    </div>
  </nav>

  <header>
  </header>

  <main class="container py-12">
    <div class="row g-7" id="Check us out online">
      <div class="md:col-6">
        <div class="card">
          <div class="card-body">
            <h2>Check us out online</h2>
            <p>
              @PLANTeeShirtsPH
            </p>
            <p>
              @PLANTeeShirtsVlog
            </p>
            <p class="fg-2">Pic here.</p>
          </div>
        </div>
      </div>

      <div class="md:col-6">
        <div class="card">
          <div class="card-body">
            <main>
              <h2>Contact Us</h2>
              <p class="intro">
                Have a question? Email us:
              </p>

              <div class="page-layout">
                <form id="contact-form" class="contact-form" action="#" method="post">
                  <div class="form-group">
                    <label for="full-name">Full name <span class="required">(required)</span></label>
                    <input type="text" id="full-name" name="full_name" required autocomplete="name">
                  </div>

                  <div class="form-group">
                    <label for="email">Email address <span class="required">(required)</span></label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                  </div>

                  <div class="form-group">
                    <label for="topic">Topic <span class="required">(required)</span></label>
                    <select id="topic" name="topic" required>
                      <option value="">Choose a topic</option>
                      <option value="order">A question about an order</option>
                      <option value="product">A question about a product</option>
                      <option value="other">Something else</option>
                    </select>
                  </div>

                  <div class="form-group">
                    <label for="message">Message <span class="required">(required)</span></label>
                    <p id="message-hint" class="hint">Please do not include passwords or payment details.</p>
                    <textarea id="message" name="message" rows="6" required aria-describedby="message-hint"></textarea>
                  </div>

                  <button class="button" type="submit">Send message</button>
                </form>
              </div>
            </main>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-1 border-top py-7 mt-auto" id="contact">
    <div class="container d-flex flex-column md:flex-row gap-2 ">
      <a href="privacy-policy.html" class="fg-2 text-decoration-none">PRIVACY POLICY</a>
      <span class="fg-2 px-1">|</span>
      <a href="terms.html" class="fg-2 text-decoration-none">TERMS</a>
    </div>
  </footer>

  <script type="module"
    src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous"></script>

</body>
</html>
